<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pattern Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    background:#f4f4f5;color:#1c1c1e;
    font-family:'Outfit',system-ui,sans-serif;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

  #game{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:#f4f4f5;
    overflow:hidden;padding:12px;gap:12px;
  }

  #bg{
    position:absolute;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(120,120,130,.10) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(100,100,110,.08) 0%, transparent 50%);
  }

  /* ---------- TOP BAR ---------- */
  #topBar{
    position:relative;z-index:5;
    width:min(94vw, 480px);
    display:flex;justify-content:space-between;align-items:center;
    padding:0 4px;
    flex-shrink:0;
  }
  .hud-block{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hud-block.right{text-align:right;align-items:flex-end}
  .hud-label{
    font-size:clamp(8px,1.1vw,10px);
    letter-spacing:.24em;
    color:#71717a;
    text-transform:uppercase;font-weight:600;
    white-space:nowrap;
  }
  .hud-val{
    font-size:clamp(20px,3vw,26px);
    font-weight:600;
    color:#1c1c1e;line-height:1;
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
  }
  .hud-val.level{color:#52525b}

  /* Lives display */
  #lives{
    display:flex;gap:6px;align-items:center;
  }
  .life{
    width:16px;height:16px;
    border-radius:50%;
    background:#52525b;
    transition:background .3s, transform .3s;
  }
  .life.lost{
    background:#e4e4e7;
    transform:scale(.85);
  }

  /* ---------- STATUS TEXT ---------- */
  #status{
    position:relative;z-index:5;
    font-size:clamp(12px,1.6vw,14px);
    font-weight:500;
    color:#71717a;
    letter-spacing:.05em;
    text-align:center;
    min-height:1.4em;
    flex-shrink:0;
    transition:color .2s;
  }
  #status.watching{color:#3f3f46;font-weight:600}
  #status.your-turn{color:#18181b;font-weight:600}
  #status.correct{color:#3f6212}
  #status.wrong{color:#9f1239}

  /* ---------- GRID ---------- */
  #gridWrap{
    position:relative;z-index:5;
    padding:12px;
    border-radius:24px;
    background:#fafafa;
    box-shadow:
      0 20px 40px -16px rgba(60,60,70,.18),
      0 4px 12px rgba(60,60,70,.06),
      inset 0 0 0 1px rgba(255,255,255,.9);
    flex-shrink:0;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:10px;
    width:min(80vw, 58vh, 360px);
    height:min(80vw, 58vh, 360px);
  }
  .tile{
    background:#e4e4e7;
    border-radius:18px;
    cursor:pointer;
    transition:background .12s, transform .12s, box-shadow .15s;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .tile::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:18px;
    box-shadow:inset 0 -3px 0 rgba(60,60,70,.06);
    pointer-events:none;
  }
  .tile:hover:not(.flash){
    background:#d4d4d8;
  }
  .tile:active:not(.flash){
    transform:scale(.97);
  }
  .tile.flash{
    background:#52525b;
    box-shadow:0 0 24px rgba(82,82,91,.45), inset 0 0 20px rgba(255,255,255,.18);
    transform:scale(1.03);
  }
  .tile.correct{
    background:#84cc16;
    box-shadow:0 0 20px rgba(132,204,22,.5);
  }
  .tile.wrong{
    background:#be123c;
    box-shadow:0 0 20px rgba(190,18,60,.55);
    animation:shake .35s ease-in-out;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
  }

  /* Grid disabled state */
  body.locked .tile{
    cursor:not-allowed;
    pointer-events:none;
  }

  /* ---------- INTRO OVERLAY ---------- */
  #intro, #overlay{
    position:absolute;inset:0;z-index:20;
    display:none;align-items:center;justify-content:center;
    background:rgba(244,244,245,.96);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    animation:fadeIn .3s;
    padding:20px;
  }
  #intro.show, #overlay.show{display:flex}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .card{
    text-align:center;
    padding:clamp(24px,4vw,36px) clamp(26px,4vw,40px);
    max-width:92%;
    animation:rise .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes rise{
    0%{transform:translateY(14px);opacity:0}
    100%{transform:translateY(0);opacity:1}
  }

  .card-title{
    font-size:clamp(30px,5vw,42px);
    font-weight:300;letter-spacing:-.01em;
    color:#18181b;line-height:1;
    margin-bottom:4px;
  }
  .card-title .accent{color:#52525b;font-weight:500}
  .card-sub{
    font-size:clamp(9px,1.2vw,11px);
    color:#71717a;
    letter-spacing:.3em;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:24px;
  }
  .rules{
    display:flex;flex-direction:column;gap:10px;
    text-align:left;margin-bottom:26px;
  }
  .rule{
    display:flex;align-items:flex-start;gap:12px;
    font-size:clamp(11px,1.5vw,13px);
    color:#27272a;line-height:1.45;font-weight:400;
  }
  .rule strong{color:#3f3f46;font-weight:600}
  .rule-num{
    flex-shrink:0;
    width:24px;height:24px;border-radius:50%;
    background:#e4e4e7;color:#52525b;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;
  }
  .count{
    font-size:clamp(44px,7vw,64px);
    font-weight:200;color:#52525b;
    line-height:1;letter-spacing:-.03em;
    animation:countPop .9s ease-out;
  }
  @keyframes countPop{
    0%{transform:scale(1.4);opacity:0}
    50%{transform:scale(.95);opacity:1}
    100%{transform:scale(1);opacity:1}
  }

  /* Result panel */
  .result-title{
    font-size:clamp(28px,4.5vw,40px);
    font-weight:300;letter-spacing:-.01em;
    color:#18181b;line-height:1;
    margin-bottom:8px;
  }
  .result-title .accent{color:#9f1239;font-weight:500}
  .result-score{
    font-size:clamp(56px,10vw,88px);
    font-weight:200;color:#52525b;
    line-height:.9;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;
    margin:12px 0;
  }
  .result-score-label{
    font-size:clamp(9px,1.2vw,11px);
    color:#71717a;
    letter-spacing:.35em;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:10px;
  }
  .result-best{
    font-size:clamp(11px,1.4vw,13px);
    color:#52525b;
    letter-spacing:.2em;
    text-transform:uppercase;
    font-weight:600;
    margin-bottom:24px;
  }

  .card-btn{
    background:#27272a;color:#fafafa;
    border:none;
    padding:14px 38px;
    border-radius:48px;
    font-family:'Outfit',sans-serif;
    font-size:clamp(11px,1.4vw,13px);
    font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;cursor:pointer;
    transition:.25s;
    box-shadow:0 10px 24px -8px rgba(60,60,70,.6);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .card-btn:hover{
    background:#18181b;
    transform:translateY(-2px);
    box-shadow:0 14px 30px -8px rgba(60,60,70,.7);
  }
  .card-btn:active{transform:translateY(0)}

  /* ---------- TOP RIGHT BUTTON ---------- */
  #restartBtnTop{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top));
    right:calc(14px + env(safe-area-inset-right));
    z-index:30;
    width:38px;height:38px;border-radius:50%;
    background:#fafafa;
    border:1px solid #e4e4e7;
    color:#52525b;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:500;
    box-shadow:0 4px 12px rgba(60,60,70,.08);
    transition:.2s;
    line-height:1;
    padding-bottom:3px;
  }
  #restartBtnTop:hover{background:#fff;transform:translateY(-1px)}
  #restartBtnTop:active{transform:scale(.94)}

  /* ---------- HINT ---------- */
  #hint{
    position:fixed;
    bottom:calc(10px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    font-size:11px;
    color:#a1a1aa;
    letter-spacing:.15em;
    text-transform:uppercase;font-weight:500;
    z-index:8;pointer-events:none;
    text-align:center;white-space:nowrap;
    opacity:.9;
  }

  /* ---------- SMALL SCREENS ---------- */
  @media (max-width:520px){
    #game{padding:8px;gap:8px}
    #grid{gap:8px;width:min(86vw, 52vh, 320px);height:min(86vw, 52vh, 320px);}
    #gridWrap{padding:10px;border-radius:20px}
    #hint{display:none}
    .tile{border-radius:14px}
    .card{padding:20px 24px}
  }

  @media (orientation:landscape) and (max-height:520px){
    #game{padding:6px;gap:4px}
    #grid{gap:8px;width:min(50vw, 72vh, 320px);height:min(50vw, 72vh, 320px);}
    #hint{display:none}
    #status{font-size:11px}
  }
</style>
</head>
<body>

<button id="restartBtnTop" title="Restart">↻</button>

<div id="game">
  <div id="bg"></div>

  <div id="topBar">
    <div class="hud-block">
      <div class="hud-label">Level</div>
      <div class="hud-val level" id="levelVal">1</div>
    </div>
    <div class="hud-block right">
      <div class="hud-label">Lives</div>
      <div id="lives"></div>
    </div>
  </div>

  <div id="status">Watch the pattern</div>

  <div id="gridWrap">
    <div id="grid"></div>
  </div>

  <div id="intro" class="show">
    <div class="card">
      <div class="card-title">Pattern <span class="accent">Chain</span></div>
      <div class="card-sub">watch · remember · repeat</div>
      <div class="rules">
        <div class="rule">
          <div class="rule-num">1</div>
          <div>Watch the tiles <strong>light up</strong> in order</div>
        </div>
        <div class="rule">
          <div class="rule-num">2</div>
          <div>Tap them back in the <strong>same sequence</strong></div>
        </div>
        <div class="rule">
          <div class="rule-num">3</div>
          <div>Each level is a <strong>new</strong> pattern with 1 more tile. <strong>3 lives.</strong></div>
        </div>
      </div>
      <div class="count" id="introCount">3</div>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <div class="result-title">Game <span class="accent">over</span></div>
      <div class="card-sub">you reached</div>
      <div class="result-score" id="ovLevel">1</div>
      <div class="result-score-label">Level Reached</div>
      <div class="result-best" id="ovBest">Best: 1</div>
      <button class="card-btn" id="restartBtn">Try Again</button>
    </div>
  </div>

  <div id="hint">Watch · memorize · tap the same order</div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   CONFIG
   ============================================================ */
var GRID_SIZE = 3;
var TILE_COUNT = GRID_SIZE * GRID_SIZE;   // 9
var MAX_LIVES = 3;
var FLASH_DURATION = 380;
var GAP_BETWEEN_FLASHES = 220;
var PAUSE_BEFORE_YOUR_TURN = 500;
var SAVE_KEY = 'deadpool-pattern-chain-best';

/* Tones for tiles — 6 tones cycling */
var TONES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

/* ============================================================
   DOM
   ============================================================ */
var grid = document.getElementById('grid');
var levelVal = document.getElementById('levelVal');
var livesEl = document.getElementById('lives');
var statusEl = document.getElementById('status');
var intro = document.getElementById('intro');
var introCount = document.getElementById('introCount');
var overlay = document.getElementById('overlay');
var ovLevel = document.getElementById('ovLevel');
var ovBest = document.getElementById('ovBest');
var restartBtn = document.getElementById('restartBtn');
var restartBtnTop = document.getElementById('restartBtnTop');

/* ============================================================
   STATE
   ============================================================ */
var tiles = [];
var sequence = [];
var userIndex = 0;
var level = 1;
var lives = MAX_LIVES;
var phase = 'idle';
var best = 0;
try { best = parseInt(localStorage.getItem(SAVE_KEY) || '0') || 0; } catch(e){}

/* ============================================================
   AUDIO
   ============================================================ */
var audioCtx = null;
var soundOn = true;
function initAudio(){
  if (audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch(e){ audioCtx = null; }
}
function playTone(freq, dur, type, vol){
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    osc.connect(g); g.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol || 0.09, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.start(now); osc.stop(now + dur + 0.02);
  } catch(e){}
}
function sndTile(i){ playTone(TONES[i % TONES.length], 0.35, 'sine', 0.11); }
function sndCorrect(){ playTone(880, 0.08, 'sine', 0.07); }
function sndWrong(){
  playTone(200, 0.15, 'triangle', 0.11);
  setTimeout(function(){ playTone(150, 0.22, 'triangle', 0.11); }, 100);
}
function sndLevelUp(){
  playTone(660, 0.1, 'sine', 0.08);
  setTimeout(function(){ playTone(880, 0.1, 'sine', 0.08); }, 110);
  setTimeout(function(){ playTone(1100, 0.16, 'sine', 0.08); }, 220);
}
function sndGameOver(){
  playTone(440, 0.15, 'sine', 0.08);
  setTimeout(function(){ playTone(330, 0.2, 'sine', 0.08); }, 130);
  setTimeout(function(){ playTone(220, 0.3, 'sine', 0.08); }, 280);
}
function sndTick(){ playTone(660, 0.06, 'sine', 0.05); }

/* ============================================================
   BUILD GRID
   ============================================================ */
function buildGrid(){
  grid.innerHTML = '';
  tiles = [];
  for (var i = 0; i < TILE_COUNT; i++){
    (function(idx){
      var t = document.createElement('div');
      t.className = 'tile';
      t.dataset.index = idx;
      t.addEventListener('click', function(){ onTileClick(idx); });
      t.addEventListener('touchstart', function(e){
        e.preventDefault();
        onTileClick(idx);
      }, {passive:false});
      grid.appendChild(t);
      tiles.push(t);
    })(i);
  }
}

function buildLives(){
  livesEl.innerHTML = '';
  for (var i = 0; i < MAX_LIVES; i++){
    var l = document.createElement('div');
    l.className = 'life';
    livesEl.appendChild(l);
  }
}

function updateLivesUI(){
  var lifeEls = livesEl.querySelectorAll('.life');
  for (var i = 0; i < MAX_LIVES; i++){
    lifeEls[i].className = 'life' + (i < lives ? '' : ' lost');
  }
}

function setStatus(text, cls){
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function lockGrid(locked){
  if (locked) document.body.classList.add('locked');
  else document.body.classList.remove('locked');
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function startGame(){
  level = 1;
  lives = MAX_LIVES;
  sequence = [];
  buildLives();
  updateLivesUI();
  levelVal.textContent = level;
  overlay.classList.remove('show');
  lockGrid(true);
  startIntro();
}

function startIntro(){
  var count = 3;
  introCount.textContent = count;
  sndTick();
  var iv = setInterval(function(){
    count--;
    if (count > 0){
      introCount.textContent = count;
      introCount.style.animation = 'none';
      void introCount.offsetWidth;
      introCount.style.animation = '';
      sndTick();
    } else {
      clearInterval(iv);
      introCount.textContent = 'GO';
      playTone(990, 0.14, 'sine', 0.08);
      setTimeout(function(){
        intro.classList.remove('show');
        beginLevel();
      }, 500);
    }
  }, 700);
}

/* Build a FRESH random sequence for the current level.
   Length = level + 2 (so level 1 = 3 tiles, level 2 = 4 tiles, etc.)
   Each tile is chosen independently — no carry-over from previous levels. */
function generateNewSequence(len){
  var seq = [];
  for (var i = 0; i < len; i++){
    seq.push(Math.floor(Math.random() * TILE_COUNT));
  }
  return seq;
}

function beginLevel(){
  levelVal.textContent = level;
  // Each level: fresh pattern, length = level + 2
  var seqLen = level + 2;
  sequence = generateNewSequence(seqLen);

  userIndex = 0;
  lockGrid(true);
  setStatus('Watch carefully…', 'watching');
  playSequence();
}

function playSequence(){
  phase = 'watching';
  var i = 0;
  function next(){
    if (i >= sequence.length){
      setTimeout(function(){
        phase = 'your-turn';
        userIndex = 0;
        lockGrid(false);
        setStatus('Your turn', 'your-turn');
      }, PAUSE_BEFORE_YOUR_TURN);
      return;
    }
    var idx = sequence[i];
    var tile = tiles[idx];
    tile.classList.add('flash');
    sndTile(idx);
    setTimeout(function(){
      tile.classList.remove('flash');
      i++;
      setTimeout(next, GAP_BETWEEN_FLASHES);
    }, FLASH_DURATION);
  }
  setTimeout(next, 400);
}

function onTileClick(idx){
  if (phase !== 'your-turn') return;

  var tile = tiles[idx];

  if (idx === sequence[userIndex]){
    // Correct tap
    tile.classList.add('correct');
    sndCorrect();
    setTimeout(function(){ tile.classList.remove('correct'); }, 220);

    userIndex++;

    if (userIndex >= sequence.length){
      // Level complete
      phase = 'correct';
      lockGrid(true);
      sndLevelUp();
      setStatus('Level ' + level + ' cleared!', 'correct');

      setTimeout(function(){
        level++;
        levelVal.textContent = level;
        setStatus('Get ready…', '');
        setTimeout(beginLevel, 700);
      }, 1000);
    }
  } else {
    // Wrong tap
    phase = 'wrong';
    lockGrid(true);
    tile.classList.add('wrong');
    sndWrong();
    setStatus('Oops!', 'wrong');
    lives--;
    updateLivesUI();

    setTimeout(function(){
      tile.classList.remove('wrong');
      if (lives <= 0){
        gameOver();
      } else {
        // Replay the SAME sequence (so the player has a fair chance)
        userIndex = 0;
        setStatus('Try again — same sequence', 'watching');
        setTimeout(function(){
          playSequence();
        }, 800);
      }
    }, 700);
  }
}

function gameOver(){
  sndGameOver();
  var reached = level;
  if (reached > best){
    best = reached;
    try { localStorage.setItem(SAVE_KEY, best.toString()); } catch(e){}
  }
  setTimeout(function(){
    ovLevel.textContent = reached;
    ovBest.textContent = 'Best: ' + best;
    overlay.classList.add('show');
  }, 400);
}

/* ============================================================
   RESTART
   ============================================================ */
restartBtn.addEventListener('click', function(){
  startGame();
});
restartBtnTop.addEventListener('click', function(e){
  e.stopPropagation();
  intro.classList.remove('show');
  overlay.classList.remove('show');
  startGame();
});

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && overlay.classList.contains('show')){
    startGame();
  }
});

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('pointerdown', function(){ initAudio(); }, {once:true});

buildGrid();
startGame();

})();
</script>
</body>
</html>
